name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: shellcheck -S warning serve.sh docker/*.sh kernels/build.sh tests/*.sh
      - run: python -m pip install -q pytest
      # static checks only here: the full patch run needs the base image's vLLM sources (tests/fetch_vllm_src.sh),
      # which docker/build.sh fetches and runs locally before every image build
      - run: python -m pytest tests -q
